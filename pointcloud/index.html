<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Point Cloud Viewer — Captures 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
    #viewer { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 16px; left: 16px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 16px 20px;
      font-size: 13px; line-height: 1.8;
      pointer-events: none; z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #hud h2 { font-size: 16px; margin-bottom: 6px; font-weight: 600; }
    #hud .stat { color: rgba(255,255,255,0.6); }
    #hud .stat b { color: #4fc3f7; font-weight: 500; }
    #controls-help {
      position: fixed; bottom: 16px; left: 16px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 14px 18px;
      font-size: 12px; line-height: 1.7;
      pointer-events: none; z-index: 10;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #controls-help kbd {
      background: rgba(255,255,255,0.15); border-radius: 4px;
      padding: 1px 6px; font-family: monospace; font-size: 11px;
      color: rgba(255,255,255,0.8);
    }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a0a; display: flex; align-items: center;
      justify-content: center; z-index: 100; flex-direction: column; gap: 16px;
    }
    #loading h2 { font-size: 18px; font-weight: 400; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-status { color: rgba(255,255,255,0.5); font-size: 13px; }
    #upload-btn {
      position: fixed; top: 16px; right: 16px;
      background: rgba(79,195,247,0.2); color: #4fc3f7;
      border: 1px solid rgba(79,195,247,0.3); border-radius: 10px;
      padding: 10px 18px; cursor: pointer; font-size: 13px;
      z-index: 10; transition: all 0.2s;
    }
    #upload-btn:hover { background: rgba(79,195,247,0.3); }
    #point-size-ctrl {
      position: fixed; bottom: 16px; right: 16px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      border-radius: 12px; padding: 12px 18px;
      z-index: 10; border: 1px solid rgba(255,255,255,0.1);
    }
    #point-size-ctrl label { font-size: 12px; color: rgba(255,255,255,0.6); display: block; margin-bottom: 4px; }
    #point-size-ctrl input[type=range] { width: 120px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2>Loading Point Cloud</h2>
    <div id="loading-status">Initializing...</div>
  </div>

  <div id="viewer"></div>

  <div id="hud">
    <h2>3D Point Cloud</h2>
    <div class="stat">Points: <b id="stat-points">--</b></div>
    <div class="stat">Source: <b id="stat-source">Depth Anything V2</b></div>
    <div class="stat">Frames: <b id="stat-frames">1 panorama (360°)</b></div>
    <div class="stat">Cutaway: <b id="stat-cutaway">OFF</b></div>
  </div>

  <div id="controls-help">
    <kbd>Left drag</kbd> Rotate &nbsp;
    <kbd>Right drag</kbd> Pan &nbsp;
    <kbd>Scroll</kbd> Zoom &nbsp;
    <kbd>R</kbd> Reset &nbsp;
    <kbd>C</kbd> Cutaway &nbsp;
    <kbd>↑↓</kbd> Cut height
  </div>

  <button id="upload-btn" onclick="document.getElementById('file-upload').click()">
    📂 Upload PLY
    <input type="file" id="file-upload" accept=".ply" hidden>
  </button>

  <div id="point-size-ctrl">
    <label>Point Size</label>
    <input type="range" id="point-size" min="0.5" max="8" step="0.5" value="2">
    <label style="margin-top:8px">Cut Height</label>
    <input type="range" id="cut-height" min="-100" max="100" step="1" value="100">
    <button id="cutaway-btn" style="margin-top:8px;width:100%;padding:6px;background:rgba(79,195,247,0.2);color:#4fc3f7;border:1px solid rgba(79,195,247,0.3);border-radius:6px;cursor:pointer;font-size:12px">Toggle Cutaway (C)</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    const container = document.getElementById('viewer');
    const loadingEl = document.getElementById('loading');
    const loadingStatus = document.getElementById('loading-status');

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(5, 8, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    // Grid helper
    const grid = new THREE.GridHelper(30, 30, 0x333333, 0x1a1a1a);
    scene.add(grid);

    // Axes helper
    const axes = new THREE.AxesHelper(2);
    scene.add(axes);

    let pointCloud = null;
    let pointMaterial = null;
    let cutawayEnabled = false;
    let cutHeight = 100; // percentage, 100 = no cut
    let originalPositions = null;
    let originalColors = null;
    let clippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);

    function applyCutaway() {
      if (!pointCloud || !originalPositions) return;
      const geo = pointCloud.geometry;
      const pos = geo.attributes.position;
      const col = geo.attributes.color;
      const n = originalPositions.length / 3;

      // Find Y range
      let yMin = Infinity, yMax = -Infinity;
      for (let i = 0; i < n; i++) {
        const y = originalPositions[i * 3 + 1];
        if (y < yMin) yMin = y;
        if (y > yMax) yMax = y;
      }

      const cutY = yMin + (yMax - yMin) * (cutHeight / 100);

      if (!cutawayEnabled) {
        // Restore all points
        pos.array.set(originalPositions);
        if (col && originalColors) col.array.set(originalColors);
        pos.needsUpdate = true;
        if (col) col.needsUpdate = true;
        geo.setDrawRange(0, n);
        document.getElementById('stat-cutaway').textContent = 'OFF';
        return;
      }

      // Hide points above cutY by moving them far away
      let visCount = 0;
      for (let i = 0; i < n; i++) {
        const y = originalPositions[i * 3 + 1];
        if (y <= cutY) {
          pos.array[visCount * 3] = originalPositions[i * 3];
          pos.array[visCount * 3 + 1] = originalPositions[i * 3 + 1];
          pos.array[visCount * 3 + 2] = originalPositions[i * 3 + 2];
          if (col && originalColors) {
            col.array[visCount * 3] = originalColors[i * 3];
            col.array[visCount * 3 + 1] = originalColors[i * 3 + 1];
            col.array[visCount * 3 + 2] = originalColors[i * 3 + 2];
          }
          visCount++;
        }
      }
      geo.setDrawRange(0, visCount);
      pos.needsUpdate = true;
      if (col) col.needsUpdate = true;
      const pct = Math.round(cutHeight);
      document.getElementById('stat-cutaway').textContent = `${pct}% (${visCount.toLocaleString()} pts)`;
    }

    function loadPLY(url, filename = 'scene') {
      loadingEl.style.display = 'flex';
      loadingStatus.textContent = 'Downloading PLY file...';

      const loader = new PLYLoader();
      loader.load(url, (geometry) => {
        loadingStatus.textContent = 'Processing geometry...';

        if (pointCloud) {
          scene.remove(pointCloud);
          pointCloud.geometry.dispose();
          pointCloud.material.dispose();
        }

        geometry.computeBoundingBox();
        const bbox = geometry.boundingBox;
        const center = new THREE.Vector3();
        bbox.getCenter(center);
        geometry.translate(-center.x, -center.y, -center.z);

        const hasColors = geometry.hasAttribute('color');

        pointMaterial = new THREE.PointsMaterial({
          size: 2,
          sizeAttenuation: true,
          vertexColors: hasColors,
          color: hasColors ? 0xffffff : 0x4fc3f7,
        });

        pointCloud = new THREE.Points(geometry, pointMaterial);
        scene.add(pointCloud);

        // Store original positions for cutaway
        originalPositions = new Float32Array(geometry.attributes.position.array);
        if (geometry.hasAttribute('color')) {
          originalColors = new Float32Array(geometry.attributes.color.array);
        }

        // Center camera
        geometry.computeBoundingBox();
        const newBbox = geometry.boundingBox;
        const size = new THREE.Vector3();
        newBbox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(maxDim * 0.8, maxDim * 0.6, maxDim * 0.8);
        controls.target.set(0, 0, 0);
        controls.update();

        const numPoints = geometry.attributes.position.count;
        document.getElementById('stat-points').textContent = numPoints.toLocaleString();

        loadingEl.style.display = 'none';
      }, (progress) => {
        if (progress.total > 0) {
          const pct = Math.round(progress.loaded / progress.total * 100);
          loadingStatus.textContent = `Downloading... ${pct}%`;
        }
      }, (error) => {
        console.error('PLY load error:', error);
        loadingStatus.textContent = `Error: ${error.message}`;
      });
    }

    // Load default PLY
    loadPLY('output.ply', 'Room Scan');

    // File upload
    document.getElementById('file-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      document.getElementById('stat-source').textContent = file.name;
      loadPLY(url, file.name);
    });

    // Point size control
    document.getElementById('point-size').addEventListener('input', (e) => {
      if (pointMaterial) pointMaterial.size = parseFloat(e.target.value);
    });

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'r' || e.key === 'R') {
        if (pointCloud) {
          const bbox = pointCloud.geometry.boundingBox;
          const size = new THREE.Vector3();
          bbox.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);
          camera.position.set(maxDim * 0.8, maxDim * 0.6, maxDim * 0.8);
          controls.target.set(0, 0, 0);
        }
      }
      if (e.key === 'c' || e.key === 'C') {
        cutawayEnabled = !cutawayEnabled;
        if (cutawayEnabled) cutHeight = 70; // default cut at 70%
        document.getElementById('cut-height').value = cutHeight;
        applyCutaway();
      }
      if (e.key === 'ArrowUp') {
        cutHeight = Math.min(100, cutHeight + 3);
        document.getElementById('cut-height').value = cutHeight;
        if (cutawayEnabled) applyCutaway();
      }
      if (e.key === 'ArrowDown') {
        cutHeight = Math.max(10, cutHeight - 3);
        document.getElementById('cut-height').value = cutHeight;
        if (cutawayEnabled) applyCutaway();
      }
    });

    // Cutaway controls
    document.getElementById('cut-height').addEventListener('input', (e) => {
      cutHeight = parseFloat(e.target.value);
      if (cutawayEnabled) applyCutaway();
    });
    document.getElementById('cutaway-btn').addEventListener('click', () => {
      cutawayEnabled = !cutawayEnabled;
      if (cutawayEnabled && cutHeight >= 100) cutHeight = 70;
      document.getElementById('cut-height').value = cutHeight;
      applyCutaway();
    });

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
