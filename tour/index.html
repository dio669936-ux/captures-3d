<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captures 3D — Virtual Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }

        #panorama { width: 100%; height: 100vh; }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }
        .top-bar h1 { font-size: 16px; font-weight: 500; opacity: 0.9; }
        .spot-label {
            font-size: 14px; opacity: 0.7; background: rgba(255,255,255,0.1);
            padding: 4px 12px; border-radius: 20px;
        }

        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center;
            padding: 0 20px 20px; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: none;
        }
        .bottom-bar > * { pointer-events: auto; }

        .thumb-strip {
            display: flex; gap: 6px; padding: 10px;
            overflow-x: auto; max-width: 100%;
            scrollbar-width: none;
        }
        .thumb-strip::-webkit-scrollbar { display: none; }
        .thumb {
            width: 64px; height: 36px; border-radius: 6px;
            border: 2px solid transparent; cursor: pointer;
            object-fit: cover; opacity: 0.6; transition: all 0.2s;
            flex-shrink: 0;
        }
        .thumb:hover { opacity: 0.9; transform: scale(1.1); }
        .thumb.active { border-color: #4fc3f7; opacity: 1; }

        .nav-arrows { display: flex; gap: 12px; margin-top: 8px; }
        .nav-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; backdrop-filter: blur(10px);
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }

        .dollhouse-btn {
            position: fixed; bottom: 100px; right: 20px; z-index: 100;
            width: 48px; height: 48px; border-radius: 12px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); transition: all 0.2s;
        }
        .dollhouse-btn:hover { background: rgba(255,255,255,0.3); }
        .dollhouse-btn.active { background: #4fc3f7; border-color: #4fc3f7; }

        .dollhouse-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 90; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .dollhouse-overlay.visible { display: flex; }
        .dollhouse-container {
            position: relative; max-width: 90vw; max-height: 80vh;
        }
        .dollhouse-container .floorplan-img {
            max-width: 100%; max-height: 80vh; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: block;
        }

        .hotspot-dot {
            position: absolute; width: 24px; height: 24px;
            border-radius: 50%; background: #4fc3f7;
            border: 3px solid #fff; cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.2s; z-index: 5;
            box-shadow: 0 2px 8px rgba(79,195,247,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #fff;
        }
        .hotspot-dot:hover { transform: translate(-50%, -50%) scale(1.3); }
        .hotspot-dot.active {
            background: #ff7043; border-color: #fff;
            box-shadow: 0 2px 12px rgba(255,112,67,0.6);
            animation: pulse 1.5s ease-in-out infinite;
            width: 30px; height: 30px;
        }
        .hotspot-dot .dot-label {
            position: absolute; top: -28px; left: 50%;
            transform: translateX(-50%); font-size: 11px;
            white-space: nowrap; background: rgba(0,0,0,0.7);
            padding: 2px 8px; border-radius: 4px;
            opacity: 0; transition: opacity 0.2s;
        }
        .hotspot-dot:hover .dot-label { opacity: 1; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,112,67,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,112,67,0); }
        }

        .pnlm-hotspot-base { cursor: pointer !important; }
        .custom-hotspot {
            width: 30px; height: 30px; background: rgba(79,195,247,0.8);
            border: 2px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s; cursor: pointer;
        }
        .custom-hotspot:hover { transform: scale(1.3); }
        .custom-hotspot span { font-size: 16px; }

        .loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0a; display: flex; align-items: center;
            justify-content: center; z-index: 200; transition: opacity 0.5s;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .loading-text { font-size: 18px; opacity: 0.7; }

        .close-dollhouse {
            position: absolute; top: -40px; right: 0;
            background: none; border: none; color: #fff;
            font-size: 28px; cursor: pointer; opacity: 0.7;
        }
        .close-dollhouse:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="loading" id="loading">
    <div class="loading-text">Loading tour...</div>
</div>

<div class="top-bar">
    <h1>Captures 3D Tour</h1>
    <div class="spot-label" id="spot-label">Viewpoint 1 / 17</div>
</div>

<div id="panorama"></div>

<button class="dollhouse-btn" id="dollhouse-btn" title="Dollhouse View (D)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
</button>

<div class="dollhouse-overlay" id="dollhouse-overlay">
    <div class="dollhouse-container" id="dollhouse-container">
        <button class="close-dollhouse" id="close-dollhouse">&times;</button>
        <img class="floorplan-img" id="floorplan-img" src="floorplan.jpg" alt="Floor Plan">
    </div>
</div>

<div class="bottom-bar">
    <div class="thumb-strip" id="thumb-strip"></div>
    <div class="nav-arrows">
        <button class="nav-btn" id="prev-btn" title="Previous">&laquo;</button>
        <button class="nav-btn" id="next-btn" title="Next">&raquo;</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
// Auto-generated positions from depth-based camera trajectory analysis
const TOUR_CONFIG = {
    canvasSize: 800,
    panoramas: [
        { id: "pano_001", src: "panoramas/pano_001.jpg", label: "Viewpoint 1", x: 305, y: 639 },
        { id: "pano_002", src: "panoramas/pano_002.jpg", label: "Viewpoint 2", x: 302, y: 607 },
        { id: "pano_003", src: "panoramas/pano_003.jpg", label: "Viewpoint 3", x: 300, y: 576 },
        { id: "pano_004", src: "panoramas/pano_004.jpg", label: "Viewpoint 4", x: 300, y: 545 },
        { id: "pano_005", src: "panoramas/pano_005.jpg", label: "Viewpoint 5", x: 305, y: 514 },
        { id: "pano_006", src: "panoramas/pano_006.jpg", label: "Viewpoint 6", x: 320, y: 486 },
        { id: "pano_007", src: "panoramas/pano_007.jpg", label: "Viewpoint 7", x: 339, y: 462 },
        { id: "pano_008", src: "panoramas/pano_008.jpg", label: "Viewpoint 8", x: 351, y: 433 },
        { id: "pano_009", src: "panoramas/pano_009.jpg", label: "Viewpoint 9", x: 367, y: 406 },
        { id: "pano_010", src: "panoramas/pano_010.jpg", label: "Viewpoint 10", x: 376, y: 376 },
        { id: "pano_011", src: "panoramas/pano_011.jpg", label: "Viewpoint 11", x: 389, y: 347 },
        { id: "pano_012", src: "panoramas/pano_012.jpg", label: "Viewpoint 12", x: 399, y: 318 },
        { id: "pano_013", src: "panoramas/pano_013.jpg", label: "Viewpoint 13", x: 400, y: 286 },
        { id: "pano_014", src: "panoramas/pano_014.jpg", label: "Viewpoint 14", x: 397, y: 255 },
        { id: "pano_015", src: "panoramas/pano_015.jpg", label: "Viewpoint 15", x: 385, y: 226 },
        { id: "pano_016", src: "panoramas/pano_016.jpg", label: "Viewpoint 16", x: 375, y: 196 },
        { id: "pano_017", src: "panoramas/pano_017.jpg", label: "Viewpoint 17", x: 371, y: 166 },
    ]
};

const PANORAMAS = TOUR_CONFIG.panoramas;
const TOTAL_PANOS = PANORAMAS.length;
const CANVAS_SIZE = TOUR_CONFIG.canvasSize;

let currentIndex = 0;
let viewer = null;

function initViewer() {
    const scenes = {};
    PANORAMAS.forEach((p, i) => {
        const hotSpots = [];
        if (i < TOTAL_PANOS - 1) {
            hotSpots.push({
                pitch: -15, yaw: 90, type: "custom",
                cssClass: "custom-hotspot",
                createTooltipFunc: (div) => { div.innerHTML = '<span>&rarr;</span>'; },
                clickHandlerFunc: () => goTo(i + 1)
            });
        }
        if (i > 0) {
            hotSpots.push({
                pitch: -15, yaw: -90, type: "custom",
                cssClass: "custom-hotspot",
                createTooltipFunc: (div) => { div.innerHTML = '<span>&larr;</span>'; },
                clickHandlerFunc: () => goTo(i - 1)
            });
        }
        scenes[p.id] = {
            title: p.label,
            panorama: p.src,
            hotSpots: hotSpots,
            autoLoad: i === 0,
            showControls: false,
        };
    });

    viewer = pannellum.viewer('panorama', {
        default: {
            firstScene: PANORAMAS[0].id,
            autoRotate: -2,
            autoRotateInactivityDelay: 5000,
            sceneFadeDuration: 800,
            compass: false,
            showZoomCtrl: false,
            showFullscreenCtrl: false,
            mouseZoom: true,
            hfov: 110,
            minHfov: 50,
            maxHfov: 120,
        },
        scenes: scenes
    });

    viewer.on('scenechange', (sceneId) => {
        const idx = PANORAMAS.findIndex(p => p.id === sceneId);
        if (idx >= 0) { currentIndex = idx; updateUI(); }
    });
    viewer.on('load', () => {
        document.getElementById('loading').classList.add('hidden');
    });
}

function goTo(index) {
    if (index < 0 || index >= TOTAL_PANOS) return;
    currentIndex = index;
    viewer.loadScene(PANORAMAS[index].id);
    updateUI();
}

function updateUI() {
    document.getElementById('spot-label').textContent =
        `Viewpoint ${currentIndex + 1} / ${TOTAL_PANOS}`;
    document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === currentIndex);
    });
    const activeThumb = document.querySelector('.thumb.active');
    if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === TOTAL_PANOS - 1;
    updateDollhouseHotspots();
}

function createThumbnails() {
    const strip = document.getElementById('thumb-strip');
    PANORAMAS.forEach((p, i) => {
        const img = document.createElement('img');
        img.className = 'thumb' + (i === 0 ? ' active' : '');
        img.src = p.src;
        img.alt = p.label;
        img.addEventListener('click', () => goTo(i));
        strip.appendChild(img);
    });
}

// Dollhouse: overlay hotspot dots on the floor plan image
function createDollhouseHotspots() {
    const container = document.getElementById('dollhouse-container');
    // Remove old dots
    container.querySelectorAll('.hotspot-dot').forEach(d => d.remove());

    const img = document.getElementById('floorplan-img');

    PANORAMAS.forEach((p, i) => {
        const dot = document.createElement('div');
        dot.className = 'hotspot-dot' + (i === currentIndex ? ' active' : '');
        dot.innerHTML = `<span>${i + 1}</span><div class="dot-label">${p.label}</div>`;
        dot.addEventListener('click', () => {
            goTo(i);
            closeDollhouse();
        });
        container.appendChild(dot);
    });

    positionDollhouseHotspots();
}

function positionDollhouseHotspots() {
    const img = document.getElementById('floorplan-img');
    const container = document.getElementById('dollhouse-container');
    const dots = container.querySelectorAll('.hotspot-dot');

    const imgW = img.clientWidth || img.naturalWidth;
    const imgH = img.clientHeight || img.naturalHeight;

    dots.forEach((dot, i) => {
        if (i >= PANORAMAS.length) return;
        const p = PANORAMAS[i];
        const px = (p.x / CANVAS_SIZE) * imgW;
        const py = (p.y / CANVAS_SIZE) * imgH;
        dot.style.left = px + 'px';
        dot.style.top = py + 'px';
    });
}

function updateDollhouseHotspots() {
    const container = document.getElementById('dollhouse-container');
    const dots = container.querySelectorAll('.hotspot-dot');
    dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
    });
}

// Toggle dollhouse
const dollhouseBtn = document.getElementById('dollhouse-btn');
const dollhouseOverlay = document.getElementById('dollhouse-overlay');
dollhouseBtn.addEventListener('click', () => {
    dollhouseOverlay.classList.toggle('visible');
    dollhouseBtn.classList.toggle('active');
    if (dollhouseOverlay.classList.contains('visible')) {
        createDollhouseHotspots();
    }
});
document.getElementById('close-dollhouse').addEventListener('click', closeDollhouse);
dollhouseOverlay.addEventListener('click', (e) => {
    if (e.target === dollhouseOverlay) closeDollhouse();
});

function closeDollhouse() {
    dollhouseOverlay.classList.remove('visible');
    dollhouseBtn.classList.remove('active');
}

// Reposition hotspots on window resize
window.addEventListener('resize', () => {
    if (dollhouseOverlay.classList.contains('visible')) {
        positionDollhouseHotspots();
    }
});

// Navigation
document.getElementById('prev-btn').addEventListener('click', () => goTo(currentIndex - 1));
document.getElementById('next-btn').addEventListener('click', () => goTo(currentIndex + 1));

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
    if (e.key === 'ArrowRight') goTo(currentIndex + 1);
    if (e.key === 'd' || e.key === 'D') dollhouseBtn.click();
    if (e.key === 'Escape') closeDollhouse();
});

createThumbnails();
initViewer();
</script>
</body>
</html>
