<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captures 3D — Virtual Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; }

        /* Panorama Viewer */
        #panorama { width: 100%; height: 100vh; }

        /* Top Bar */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }
        .top-bar h1 { font-size: 16px; font-weight: 500; opacity: 0.9; }
        .spot-label {
            font-size: 14px; opacity: 0.7; background: rgba(255,255,255,0.1);
            padding: 4px 12px; border-radius: 20px;
        }

        /* Bottom Controls */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center;
            padding: 0 20px 20px; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: none;
        }
        .bottom-bar > * { pointer-events: auto; }

        /* Thumbnail Strip */
        .thumb-strip {
            display: flex; gap: 6px; padding: 10px;
            overflow-x: auto; max-width: 100%;
            scrollbar-width: none;
        }
        .thumb-strip::-webkit-scrollbar { display: none; }
        .thumb {
            width: 64px; height: 36px; border-radius: 6px;
            border: 2px solid transparent; cursor: pointer;
            object-fit: cover; opacity: 0.6; transition: all 0.2s;
            flex-shrink: 0;
        }
        .thumb:hover { opacity: 0.9; transform: scale(1.1); }
        .thumb.active { border-color: #4fc3f7; opacity: 1; }

        /* Navigation Arrows */
        .nav-arrows {
            display: flex; gap: 12px; margin-top: 8px;
        }
        .nav-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; backdrop-filter: blur(10px);
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }

        /* Dollhouse Toggle */
        .dollhouse-btn {
            position: fixed; bottom: 100px; right: 20px; z-index: 100;
            width: 48px; height: 48px; border-radius: 12px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); transition: all 0.2s;
        }
        .dollhouse-btn:hover { background: rgba(255,255,255,0.3); }
        .dollhouse-btn.active { background: #4fc3f7; border-color: #4fc3f7; }

        /* Dollhouse Overlay */
        .dollhouse-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 90; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .dollhouse-overlay.visible { display: flex; }
        .dollhouse-container {
            position: relative; max-width: 90vw; max-height: 80vh;
        }
        .dollhouse-container img {
            max-width: 100%; max-height: 80vh; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        /* Hotspot dots on dollhouse */
        .hotspot-dot {
            position: absolute; width: 24px; height: 24px;
            border-radius: 50%; background: #4fc3f7;
            border: 3px solid #fff; cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.2s; z-index: 5;
            box-shadow: 0 2px 8px rgba(79,195,247,0.5);
        }
        .hotspot-dot:hover { transform: translate(-50%, -50%) scale(1.3); }
        .hotspot-dot.active {
            background: #ff7043; border-color: #fff;
            box-shadow: 0 2px 12px rgba(255,112,67,0.6);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .hotspot-dot .dot-label {
            position: absolute; top: -28px; left: 50%;
            transform: translateX(-50%); font-size: 11px;
            white-space: nowrap; background: rgba(0,0,0,0.7);
            padding: 2px 8px; border-radius: 4px;
            opacity: 0; transition: opacity 0.2s;
        }
        .hotspot-dot:hover .dot-label { opacity: 1; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,112,67,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,112,67,0); }
        }

        /* Pannellum hotspot style */
        .pnlm-hotspot-base { cursor: pointer !important; }
        .custom-hotspot {
            width: 30px; height: 30px; background: rgba(79,195,247,0.8);
            border: 2px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .custom-hotspot:hover { transform: scale(1.3); }
        .custom-hotspot span { font-size: 16px; }

        /* Loading */
        .loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0a; display: flex; align-items: center;
            justify-content: center; z-index: 200; transition: opacity 0.5s;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .loading-text { font-size: 18px; opacity: 0.7; }

        /* Close dollhouse */
        .close-dollhouse {
            position: absolute; top: -40px; right: 0;
            background: none; border: none; color: #fff;
            font-size: 28px; cursor: pointer; opacity: 0.7;
        }
        .close-dollhouse:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="loading" id="loading">
    <div class="loading-text">Loading tour...</div>
</div>

<div class="top-bar">
    <h1>🏠 Captures 3D Tour</h1>
    <div class="spot-label" id="spot-label">Viewpoint 1 / 17</div>
</div>

<div id="panorama"></div>

<button class="dollhouse-btn" id="dollhouse-btn" title="Dollhouse View">🏠</button>

<div class="dollhouse-overlay" id="dollhouse-overlay">
    <div class="dollhouse-container" id="dollhouse-container">
        <button class="close-dollhouse" id="close-dollhouse">×</button>
        <canvas id="dollhouse-canvas" width="800" height="600"></canvas>
    </div>
</div>

<div class="bottom-bar">
    <div class="thumb-strip" id="thumb-strip"></div>
    <div class="nav-arrows">
        <button class="nav-btn" id="prev-btn" title="Previous">◀</button>
        <button class="nav-btn" id="next-btn" title="Next">▶</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
// Tour configuration
const PANORAMAS = [];
const TOTAL_PANOS = 17;
for (let i = 1; i <= TOTAL_PANOS; i++) {
    PANORAMAS.push({
        id: `pano_${String(i).padStart(3, '0')}`,
        src: `panoramas/pano_${String(i).padStart(3, '0')}.jpg`,
        label: `Viewpoint ${i}`,
        // Approximate positions on floor plan (will be laid out in a path)
        x: 0, y: 0
    });
}

// Layout hotspots in a walking path pattern
function layoutHotspots() {
    const cx = 400, cy = 300, rx = 280, ry = 200;
    PANORAMAS.forEach((p, i) => {
        const angle = (i / TOTAL_PANOS) * Math.PI * 2 - Math.PI / 2;
        p.x = cx + rx * Math.cos(angle);
        p.y = cy + ry * Math.sin(angle);
    });
}
layoutHotspots();

let currentIndex = 0;
let viewer = null;

// Initialize Pannellum viewer
function initViewer() {
    const scenes = {};
    PANORAMAS.forEach((p, i) => {
        const hotSpots = [];

        // Add hotspot to next panorama
        if (i < TOTAL_PANOS - 1) {
            hotSpots.push({
                pitch: -15, yaw: 90, type: "custom",
                cssClass: "custom-hotspot",
                createTooltipFunc: (div) => { div.innerHTML = '<span>→</span>'; },
                clickHandlerFunc: () => goTo(i + 1)
            });
        }
        // Add hotspot to previous panorama
        if (i > 0) {
            hotSpots.push({
                pitch: -15, yaw: -90, type: "custom",
                cssClass: "custom-hotspot",
                createTooltipFunc: (div) => { div.innerHTML = '<span>←</span>'; },
                clickHandlerFunc: () => goTo(i - 1)
            });
        }

        scenes[p.id] = {
            title: p.label,
            panorama: p.src,
            hotSpots: hotSpots,
            autoLoad: i === 0,
            showControls: false,
        };
    });

    viewer = pannellum.viewer('panorama', {
        default: {
            firstScene: PANORAMAS[0].id,
            autoRotate: -2,
            autoRotateInactivityDelay: 5000,
            sceneFadeDuration: 800,
            compass: false,
            showZoomCtrl: false,
            showFullscreenCtrl: false,
            mouseZoom: true,
            hfov: 110,
            minHfov: 50,
            maxHfov: 120,
        },
        scenes: scenes
    });

    viewer.on('scenechange', (sceneId) => {
        const idx = PANORAMAS.findIndex(p => p.id === sceneId);
        if (idx >= 0) {
            currentIndex = idx;
            updateUI();
        }
    });

    viewer.on('load', () => {
        document.getElementById('loading').classList.add('hidden');
    });
}

function goTo(index) {
    if (index < 0 || index >= TOTAL_PANOS) return;
    currentIndex = index;
    viewer.loadScene(PANORAMAS[index].id);
    updateUI();
}

function updateUI() {
    // Update label
    document.getElementById('spot-label').textContent =
        `Viewpoint ${currentIndex + 1} / ${TOTAL_PANOS}`;

    // Update thumbnails
    document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === currentIndex);
    });

    // Scroll active thumb into view
    const activeThumb = document.querySelector('.thumb.active');
    if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

    // Update nav buttons
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === TOTAL_PANOS - 1;

    // Update dollhouse hotspots
    drawDollhouse();
}

// Create thumbnails
function createThumbnails() {
    const strip = document.getElementById('thumb-strip');
    PANORAMAS.forEach((p, i) => {
        const img = document.createElement('img');
        img.className = 'thumb' + (i === 0 ? ' active' : '');
        img.src = p.src;
        img.alt = p.label;
        img.addEventListener('click', () => goTo(i));
        strip.appendChild(img);
    });
}

// Dollhouse View
function drawDollhouse() {
    const canvas = document.getElementById('dollhouse-canvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);

    // Draw grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    // Draw room outline (approximate)
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    const padding = 60;
    ctx.roundRect(padding, padding, w - padding * 2, h - padding * 2, 20);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw path connecting hotspots
    ctx.strokeStyle = 'rgba(79,195,247,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    PANORAMAS.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.stroke();

    // Draw hotspot dots
    PANORAMAS.forEach((p, i) => {
        const isActive = i === currentIndex;
        const radius = isActive ? 12 : 8;

        // Glow
        if (isActive) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,112,67,0.2)';
            ctx.fill();
        }

        // Dot
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = isActive ? '#ff7043' : '#4fc3f7';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Label
        ctx.fillStyle = '#fff';
        ctx.font = isActive ? 'bold 12px sans-serif' : '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(i + 1, p.x, p.y + 4);
    });

    // Title
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Floor Plan — Click a viewpoint', w / 2, 35);
}

// Dollhouse canvas click handler
document.getElementById('dollhouse-canvas').addEventListener('click', (e) => {
    const rect = e.target.getBoundingClientRect();
    const scaleX = 800 / rect.width;
    const scaleY = 600 / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    // Find closest hotspot
    let closest = -1, minDist = 30;
    PANORAMAS.forEach((p, i) => {
        const d = Math.sqrt((p.x - mx) ** 2 + (p.y - my) ** 2);
        if (d < minDist) { minDist = d; closest = i; }
    });

    if (closest >= 0) {
        goTo(closest);
        closeDollhouse();
    }
});

// Toggle dollhouse
const dollhouseBtn = document.getElementById('dollhouse-btn');
const dollhouseOverlay = document.getElementById('dollhouse-overlay');
dollhouseBtn.addEventListener('click', () => {
    dollhouseOverlay.classList.toggle('visible');
    dollhouseBtn.classList.toggle('active');
    if (dollhouseOverlay.classList.contains('visible')) drawDollhouse();
});
document.getElementById('close-dollhouse').addEventListener('click', closeDollhouse);
dollhouseOverlay.addEventListener('click', (e) => {
    if (e.target === dollhouseOverlay) closeDollhouse();
});

function closeDollhouse() {
    dollhouseOverlay.classList.remove('visible');
    dollhouseBtn.classList.remove('active');
}

// Navigation buttons
document.getElementById('prev-btn').addEventListener('click', () => goTo(currentIndex - 1));
document.getElementById('next-btn').addEventListener('click', () => goTo(currentIndex + 1));

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
    if (e.key === 'ArrowRight') goTo(currentIndex + 1);
    if (e.key === 'd' || e.key === 'D') dollhouseBtn.click();
    if (e.key === 'Escape') closeDollhouse();
});

// Init
createThumbnails();
initViewer();
</script>
</body>
</html>
